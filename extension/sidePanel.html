<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Application Collector</title>
    <link rel="stylesheet" href="styles/output.css">
  </head>
  <body class="bg-black text-slate-100 p-4 min-w-60">
    <div class="space-y-4">
      <!-- Header -->
      <div class = "flex justify-between">
      <div class="mb-6">
        <h1 class="font-space text-xl font-bold w-fit bg-white bg-clip-text text-transparent">
          Application Tracker
        </h1>
      </div>

      <!-- Run Button Section -->
        <button 
          id="runBtn" 
          type="button"
          class="w-fit h-fit py-1 px-4 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-space rounded-lg transition-all duration-200 shadow-lg active:scale-95"
        >
          Run
        </button>
      </div>
      <!-- Form Section -->
      <form id="saveForm">
        <!-- Company Field -->
        <div class="space-y-1.5">
          <label for="company" class="text-xs font-space text-slate-300 uppercase tracking-wide">
            Company
          </label>
          <input 
            type="text" 
            id="company" 
            name="company"  
            class="w-full px-3 py-2 bg-slate-900/50 border border-slate-600 rounded-lg text-slate-100 focus:border-white-300 focus:outline-none focus:ring-2 focus:ring-white-500/20 transition-all duration-200"
          />
        </div>

        <!-- Role Field -->
        <div class="space-y-1.5">
          <label for="role" class="text-xs font-space text-slate-300 uppercase tracking-wide">
            Role
          </label>
          <input 
            type="text" 
            id="role" 
            name="role" 
            class="w-full px-3 py-2 bg-slate-900/50 border border-slate-600 rounded-lg text-slate-100 focus:border-white-300 focus:outline-none focus:ring-2 focus:ring-white-500/20 transition-all duration-200"
          />
        </div>

        <!-- Resume Field -->
        <div class="space-y-1.5">
          <label for="resume" class="text-xs font-semibold text-slate-300 uppercase tracking-wide">
            Resume
          </label>
          <input 
            type="text" 
            id="resume" 
            name="resume" 
            class="w-full px-3 py-2 bg-slate-900/50 border border-slate-600 rounded-lg text-slate-100 focus:border-white-300 focus:outline-none focus:ring-2 focus:ring-white-500/20 transition-all duration-200"
          />
        </div>

        <!-- Submit Button -->
        <button 
          id="saveBtn" 
          type="submit"
          class="w-full py-2.5 px-4 mt-4 font-space bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-semibold rounded-lg transition-all duration-200 shadow-lg active:scale-95"
        >
          ✓ Save Application
        </button>
      </form>

    <script src="scripts/sidePanel.js"></script>
  </body>
</html>
